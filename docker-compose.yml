services:
  home_assistant:
    image: ghcr.io/home-assistant/home-assistant:stable

    container_name: home_assistant
    hostname: home_assistant

    restart: unless-stopped

    ports:
      - 8123:8123

    volumes:
      - ./docker/home_assistant/config:/config
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Asia/Dhaka

  mosquitto:
    image: eclipse-mosquitto:latest

    container_name: mosquitto
    hostname: mosquitto

    restart: unless-stopped

    ports:
      - 1883:1883
      - 9001:9001

    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Asia/Dhaka

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1s

  powerstation_simulator:
    # image: ps_sim:dev
    build:
      context: .
      dockerfile: ps_sim.dockerfile

    container_name: powerstation_simulator
    hostname: powerstation_simulator

    restart: unless-stopped

    depends_on:
      mosquitto:
        condition: service_healthy

    env_file:
      - .env.sample

    environment:
      - TZ=Asia/Dhaka
      - STATION_PREFIX=PS_001

    volumes:
      - ./src/powerstation_simulator:/app/src
      - /etc/localtime:/etc/localtime:ro

  grafana:
    image: grafana/grafana:latest

    container_name: grafana
    hostname: grafana

    restart: unless-stopped

    ports:
      - 3000:3000

    environment:
      - TZ=Asia/Dhaka
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

  influxdb:
    image: influxdb:latest

    container_name: influxdb
    hostname: influxdb

    restart: unless-stopped

    ports:
      - 8086:8086

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=smartgrid
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - TZ=Asia/Dhaka

    volumes:
      - ./docker/influxdb:/var/lib/influxdb
      - /etc/localtime:/etc/localtime:ro
